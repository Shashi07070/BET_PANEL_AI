<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CricPredict AI</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060a0f;
    --surface: #0d1520;
    --border: rgba(0,255,120,0.13);
    --green: #00ff78;
    --green2: #00c85e;
    --red: #ff4560;
    --amber: #ffa500;
    --blue: #4dc3ff;
    --text: #e8f4f0;
    --muted: #4a6a5a;
    --font-head: 'Bebas Neue', sans-serif;
    --font-body: 'Syne', sans-serif;
    --font-mono: 'DM Mono', monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:var(--bg); color:var(--text);
    font-family:var(--font-body);
    min-height:100vh; display:flex;
    flex-direction:column; align-items:center;
    overflow-x:hidden;
  }
  body::before {
    content:''; position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(0,255,120,0.03) 1px,transparent 1px),
      linear-gradient(90deg,rgba(0,255,120,0.03) 1px,transparent 1px);
    background-size:44px 44px;
    pointer-events:none; z-index:0;
  }
  .orb { position:fixed; border-radius:50%; filter:blur(130px); pointer-events:none; z-index:0; }
  .orb-1 { width:600px;height:600px;background:rgba(0,255,120,0.07);top:-150px;left:-150px; }
  .orb-2 { width:500px;height:500px;background:rgba(77,195,255,0.05);bottom:-100px;right:-100px; }

  header {
    width:100%; position:sticky; top:0; z-index:100;
    padding:18px 40px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--border);
    background:rgba(6,10,15,0.88); backdrop-filter:blur(16px);
  }
  .logo { display:flex; align-items:center; gap:12px; }
  .logo-icon {
    width:36px; height:36px; background:var(--green);
    border-radius:8px; display:flex; align-items:center;
    justify-content:center; font-size:18px;
    animation:glow 3s ease-in-out infinite;
  }
  @keyframes glow{0%,100%{box-shadow:0 0 10px rgba(0,255,120,0.4);}50%{box-shadow:0 0 28px rgba(0,255,120,0.9);}}
  .logo-text { font-family:var(--font-head); font-size:26px; letter-spacing:2px; }
  .logo-text span { color:var(--green); }
  .live-badge {
    display:flex; align-items:center; gap:8px;
    font-family:var(--font-mono); font-size:11px; color:var(--green);
    background:rgba(0,255,120,0.08); border:1px solid var(--border);
    border-radius:20px; padding:6px 14px; letter-spacing:1px;
  }
  .dot {
    width:7px; height:7px; border-radius:50%;
    background:var(--green); box-shadow:0 0 8px var(--green);
    animation:blink 1.4s infinite;
  }
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}

  main {
    position:relative; z-index:1;
    width:100%; max-width:820px;
    padding:60px 24px 80px;
    display:flex; flex-direction:column; align-items:center;
  }
  .hero-label {
    font-family:var(--font-mono); font-size:11px;
    letter-spacing:3px; color:var(--green); text-transform:uppercase;
    margin-bottom:16px; opacity:0; animation:fadeIn 0.6s 0.2s forwards;
  }
  .hero-title {
    font-family:var(--font-head); font-size:clamp(42px,8vw,80px);
    letter-spacing:3px; text-align:center; line-height:1;
    margin-bottom:16px; opacity:0; animation:fadeIn 0.6s 0.35s forwards;
  }
  .hero-title span { color:var(--green); }
  .hero-sub {
    font-size:14px; color:var(--muted); text-align:center;
    margin-bottom:52px; max-width:440px; line-height:1.8;
    opacity:0; animation:fadeIn 0.6s 0.5s forwards;
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .predict-btn {
    position:relative; padding:22px 72px;
    background:linear-gradient(135deg,var(--green),var(--green2));
    border:none; border-radius:16px; color:#000;
    font-family:var(--font-head); font-size:28px; letter-spacing:6px;
    cursor:pointer; overflow:hidden;
    transition:transform 0.25s, box-shadow 0.25s;
    opacity:0; animation:fadeIn 0.6s 0.65s forwards;
    margin-bottom:52px;
  }
  .predict-btn::before {
    content:''; position:absolute; inset:0;
    background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,0.25));
    transform:translateX(-100%); transition:transform 0.4s;
  }
  .predict-btn:hover::before{transform:translateX(0);}
  .predict-btn:hover{transform:translateY(-3px);box-shadow:0 16px 50px rgba(0,255,120,0.4);}
  .predict-btn:active{transform:translateY(0);}
  .predict-btn:disabled{
    background:rgba(0,255,120,0.12); color:var(--green);
    border:1px solid var(--border); cursor:not-allowed;
    transform:none; box-shadow:none;
  }
  .spinner {
    display:inline-block; width:18px; height:18px;
    border:2px solid rgba(0,255,120,0.3); border-top-color:var(--green);
    border-radius:50%; animation:spin 0.7s linear infinite;
    vertical-align:middle; margin-right:10px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  #result {
    width:100%; display:none;
    animation:slideUp 0.55s cubic-bezier(0.16,1,0.3,1);
  }
  @keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}

  .match-bar {
    background:var(--surface); border:1px solid var(--border);
    border-radius:16px 16px 0 0; padding:18px 28px;
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:10px;
  }
  .match-name { font-family:var(--font-head); font-size:22px; letter-spacing:2px; }
  .match-meta { font-family:var(--font-mono); font-size:10px; color:var(--muted); letter-spacing:1.5px; text-transform:uppercase; }

  .winner-block {
    background:linear-gradient(135deg,rgba(0,255,120,0.07),rgba(0,200,94,0.03));
    border:1px solid rgba(0,255,120,0.22); border-top:none;
    padding:36px 28px 32px; text-align:center;
  }
  .winner-label { font-family:var(--font-mono); font-size:10px; letter-spacing:3px; color:var(--green); text-transform:uppercase; margin-bottom:12px; }
  .winner-name {
    font-family:var(--font-head); font-size:clamp(38px,7vw,64px);
    letter-spacing:2px; color:var(--green);
    text-shadow:0 0 30px rgba(0,255,120,0.5);
    line-height:1; margin-bottom:8px;
  }
  .winner-conf { font-family:var(--font-mono); font-size:11px; color:var(--muted); letter-spacing:1.5px; max-width:500px; margin:0 auto; line-height:1.6; }

  .prob-section {
    background:var(--surface); border:1px solid var(--border);
    border-top:none; padding:24px 28px;
  }
  .prob-row { display:flex; align-items:center; gap:14px; margin-bottom:12px; }
  .prob-row:last-child{margin-bottom:0;}
  .prob-team { font-family:var(--font-head); font-size:16px; letter-spacing:1px; width:170px; text-align:right; flex-shrink:0; }
  .prob-track { flex:1; height:38px; background:rgba(255,255,255,0.05); border-radius:8px; overflow:hidden; }
  .prob-fill {
    height:100%; border-radius:8px;
    display:flex; align-items:center; justify-content:flex-end;
    padding-right:14px; font-family:var(--font-head); font-size:18px;
    width:0%; transition:width 1.3s cubic-bezier(0.16,1,0.3,1); color:#000;
  }
  .fill-a{background:linear-gradient(90deg,rgba(0,255,120,0.2),var(--green));}
  .fill-b{background:linear-gradient(90deg,rgba(77,195,255,0.2),var(--blue));}

  .analysis-block {
    background:var(--surface); border:1px solid var(--border);
    border-top:none; border-radius:0 0 16px 16px;
    padding:30px 28px; position:relative;
  }
  .analysis-block::before {
    content:'✦ GEMINI AI ANALYSIS';
    position:absolute; top:-11px; left:24px;
    background:var(--bg); padding:0 10px;
    font-family:var(--font-mono); font-size:10px;
    letter-spacing:2px; color:var(--green);
  }
  .analysis-text { font-size:14px; line-height:1.95; color:#c0ddd0; }
  .analysis-text strong { color:var(--text); }

  .factors-row { display:flex; flex-wrap:wrap; gap:8px; margin-top:22px; }
  .fp { font-family:var(--font-mono); font-size:11px; padding:5px 14px; border-radius:20px; letter-spacing:0.5px; border:1px solid var(--border); }
  .fp.g { background:rgba(0,255,120,0.06); color:var(--green); border-color:rgba(0,255,120,0.25); }
  .fp.b { background:rgba(77,195,255,0.06); color:var(--blue); border-color:rgba(77,195,255,0.2); }
  .fp.a { background:rgba(255,165,0,0.06); color:var(--amber); border-color:rgba(255,165,0,0.2); }
  .fp.r { background:rgba(255,69,96,0.06); color:var(--red); border-color:rgba(255,69,96,0.2); }

  .reset-btn {
    margin-top:20px; padding:14px 36px; background:transparent;
    border:1px solid var(--border); border-radius:10px; color:var(--muted);
    font-family:var(--font-body); font-size:13px; font-weight:600;
    letter-spacing:2px; text-transform:uppercase; cursor:pointer;
    transition:all 0.2s; display:block; width:100%; text-align:center;
  }
  .reset-btn:hover { border-color:var(--green); color:var(--green); }

  .error-box {
    background:rgba(255,69,96,0.08); border:1px solid rgba(255,69,96,0.25);
    border-radius:12px; padding:18px 22px; color:var(--red); font-size:13px;
    font-family:var(--font-mono); line-height:1.7;
    width:100%; margin-bottom:16px; display:none;
  }

  @media(max-width:600px){
    header{padding:14px 18px;}
    .predict-btn{padding:18px 40px;font-size:22px;}
    .prob-team{width:110px;font-size:13px;}
    .match-bar,.winner-block,.prob-section,.analysis-block{padding:16px;}
    .winner-name{font-size:36px;}
  }
</style>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<header>
  <div class="logo">
    <div class="logo-icon">🏏</div>
    <div class="logo-text">CRIC<span>PREDICT</span></div>
  </div>
  <div class="live-badge"><div class="dot"></div>GEMINI AI · LIVE</div>
</header>

<main>
  <div class="hero-label">⚡ Powered by Gemini AI — Real-Time Cricket Intelligence</div>
  <div class="hero-title">WHO WILL<br><span>WIN TODAY?</span></div>
  <div class="hero-sub">One tap. Gemini AI scans today's IPL match, analyses both teams — form, players, H2H, venue — and gives you the winner with full reasoning.</div>

  <button class="predict-btn" id="predictBtn">⚡ PREDICT</button>

  <div class="error-box" id="errorBox"></div>

  <div id="result">
    <div class="match-bar">
      <div class="match-name" id="matchName">—</div>
      <div class="match-meta" id="matchMeta">—</div>
    </div>
    <div class="winner-block">
      <div class="winner-label">🏆 Predicted Winner</div>
      <div class="winner-name" id="winnerName">—</div>
      <div class="winner-conf" id="winnerConf">—</div>
    </div>
    <div class="prob-section">
      <div class="prob-row">
        <div class="prob-team" id="probTeamA" style="color:var(--green)">Team A</div>
        <div class="prob-track"><div class="prob-fill fill-a" id="barA"><span id="pctA">0%</span></div></div>
      </div>
      <div class="prob-row">
        <div class="prob-team" id="probTeamB" style="color:var(--blue)">Team B</div>
        <div class="prob-track"><div class="prob-fill fill-b" id="barB"><span id="pctB">0%</span></div></div>
      </div>
    </div>
    <div class="analysis-block">
      <div class="analysis-text" id="analysisText"></div>
      <div class="factors-row" id="factorPills"></div>
    </div>
    <button class="reset-btn" id="resetBtn">🔄 Predict Again</button>
  </div>
</main>

<script type="module">
import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

// ⚠️ IMPORTANT: Replace with your actual API key, but avoid committing this directly to public repos!
const GEMINI_KEY = 'AIzaSyDrNZE7wyazYOSc9qQ37jcb_VyOZlZrzF8';
const genAI = new GoogleGenerativeAI(GEMINI_KEY);
const model = genAI.getGenerativeModel({ model: "gemini-2.0-flash" });

async function predict() {
  const btn = document.getElementById('predictBtn');
  const errorBox = document.getElementById('errorBox');
  errorBox.style.display = 'none';
  document.getElementById('result').style.display = 'none';
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> ANALYSING LIVE MATCH...';

  try {
    const today = new Date().toLocaleDateString('en-IN', {
      weekday:'long', day:'numeric', month:'long', year:'numeric'
    });

    const prompt = `Today is ${today}. You are CricPredict AI — an expert cricket analyst with deep knowledge of IPL 2025 full schedule, team squads, player current form, head-to-head history, and venue records.

Find the most prominent cricket match today or the next upcoming IPL 2025 match. Give a full detailed prediction.

RULES:
- Reply ONLY with a raw JSON object
- No markdown, no backticks, no text outside the JSON
- winProbabilityA + winProbabilityB must equal 100

JSON structure:
{
  "matchTitle": "Team A vs Team B",
  "tournament": "IPL 2025",
  "venue": "Stadium, City",
  "date": "Date and time IST",
  "teamA": "Full team name",
  "teamB": "Full team name",
  "predictedWinner": "Full name of predicted winner",
  "winProbabilityA": 57,
  "winProbabilityB": 43,
  "confidence": "HIGH",
  "headline": "One sharp sentence on why this team wins",
  "analysis": "4 paragraphs separated by \\n\\n. Para1: Recent form and results of both teams with specific scores. Para2: Key players in form with real stats — batting averages, recent scores, bowling economy. Para3: Head-to-head at this venue, pitch nature, toss impact, weather if relevant. Para4: Final verdict with strong reasoning. Use <strong> tags around player names and numbers. Min 300 words. Expert TV analyst tone.",
  "keyFactors": ["Advantage 1 for winner", "Advantage 2", "Key player factor", "One risk factor for winner"]
}`;

    const result = await model.generateContent(prompt);
    const raw = result.response.text();

    let cleaned = raw.replace(/```json|```/gi, '').trim();
    const start = cleaned.indexOf('{');
    const end = cleaned.lastIndexOf('}');
    if (start === -1 || end === -1) throw new Error('Could not read prediction. Please try again.');
    cleaned = cleaned.slice(start, end + 1);

    let d;
    try { d = JSON.parse(cleaned); }
    catch(e) { throw new Error('Prediction parse failed. Please try again.'); }

    document.getElementById('matchName').textContent = d.matchTitle || "Today's Match";
    document.getElementById('matchMeta').textContent = [d.tournament, d.venue, d.date].filter(Boolean).join(' · ');
    document.getElementById('winnerName').textContent = d.predictedWinner || '—';
    document.getElementById('winnerConf').textContent = `${d.confidence || 'MODERATE'} CONFIDENCE · ${d.headline || ''}`;
    document.getElementById('probTeamA').textContent = d.teamA || 'Team A';
    document.getElementById('probTeamB').textContent = d.teamB || 'Team B';

    const pA = Math.min(95, Math.max(5, parseInt(d.winProbabilityA) || 50));
    const pB = 100 - pA;
    document.getElementById('pctA').textContent = pA + '%';
    document.getElementById('pctB').textContent = pB + '%';

    document.getElementById('analysisText').innerHTML =
      (d.analysis || '').replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>');

    const pillColors = ['g','b','a','r'];
    const pillsEl = document.getElementById('factorPills');
    pillsEl.innerHTML = '';
    (d.keyFactors || []).forEach((f, i) => {
      const span = document.createElement('span');
      span.className = 'fp ' + (pillColors[i] || 'g');
      span.textContent = f;
      pillsEl.appendChild(span);
    });

    document.getElementById('result').style.display = 'block';
    setTimeout(() => {
      document.getElementById('barA').style.width = pA + '%';
      document.getElementById('barB').style.width = pB + '%';
    }, 250);
    document.getElementById('result').scrollIntoView({ behavior:'smooth', block:'start' });

  } catch(err) {
    errorBox.textContent = '⚠ ' + (err.message || 'Something went wrong. Please try again.');
    errorBox.style.display = 'block';
    console.error(err);
  }

  btn.disabled = false;
  btn.innerHTML = '⚡ PREDICT';
}

function resetUI() {
  document.getElementById('result').style.display = 'none';
  document.getElementById('barA').style.width = '0%';
  document.getElementById('barB').style.width = '0%';
  window.scrollTo({ top:0, behavior:'smooth' });
}

// Attach event listeners once the module loads
document.getElementById('predictBtn').addEventListener('click', predict);
document.getElementById('resetBtn').addEventListener('click', resetUI);
</script>
</body>
</html>
