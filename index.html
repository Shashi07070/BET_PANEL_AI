<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tamil247 – Match Poster Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: #07070f;
  font-family: 'Montserrat', sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 24px 16px;
  gap: 20px;
}

h1 {
  color: #f0c040;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 2rem;
  letter-spacing: 4px;
  text-align: center;
}

#status {
  color: #22c55e;
  font-size: 0.78rem;
  font-weight: 800;
  letter-spacing: 1px;
  min-height: 18px;
  text-align: center;
}

.controls {
  width: 100%;
  max-width: 960px;
  background: #10101c;
  border: 1px solid #252540;
  border-radius: 18px;
  padding: 22px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
}

.ctrl-group { display:flex; flex-direction:column; gap:7px; }
.ctrl-group.full { grid-column: 1 / -1; }

label {
  color: #777;
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  font-weight: 800;
}

input[type="text"] {
  background: #1a1a2e;
  border: 1px solid #2a2a45;
  border-radius: 8px;
  color: #fff;
  padding: 10px 14px;
  font-size: 0.88rem;
  font-family: 'Montserrat', sans-serif;
  font-weight: 700;
  width: 100%;
  transition: border-color 0.2s;
}
input[type="text"]:focus { outline: none; border-color: #f0c040; }

/* Upload zones */
.upload-zone {
  background: #1a1a2e;
  border: 2px dashed #2a2a55;
  border-radius: 10px;
  padding: 16px 10px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  position: relative;
  min-height: 110px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  overflow: hidden;
}
.upload-zone:hover { border-color: #f0c040; background: #1e1e38; }
.upload-zone input[type="file"] {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  opacity: 0; cursor: pointer; z-index: 2;
}
.upload-zone .zi { font-size: 1.8rem; }
.upload-zone .zt { color: #aaa; font-size: 0.72rem; font-weight: 800; letter-spacing: 1px; }
.zone-thumb {
  width: 100%; max-height: 80px;
  object-fit: cover; border-radius: 6px;
  display: none;
}
.zone-ok { color: #22c55e; font-size: 0.72rem; font-weight: 800; display: none; }

/* Background upload zone */
.bg-zone {
  background: #1a1a2e;
  border: 2px dashed #f0c040;
  border-radius: 10px;
  padding: 14px;
  text-align: center;
  cursor: pointer;
  position: relative;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.bg-zone input[type="file"] {
  position: absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; z-index:2;
}
.bg-zone .zt { color:#f0c040; font-size:0.72rem; font-weight:800; letter-spacing:1px; }

/* IPL chips */
.ipl-section { grid-column: 1 / -1; }
.ipl-title { color:#777; font-size:0.65rem; text-transform:uppercase; letter-spacing:1.5px; font-weight:800; margin-bottom:10px; }
.ipl-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
}
@media(max-width:560px){ .ipl-grid { grid-template-columns: repeat(4,1fr); } }

.team-chip {
  border: 2px solid #222;
  border-radius: 10px;
  padding: 8px 4px;
  text-align: center;
  cursor: pointer;
  transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
}
.team-chip:hover { transform: scale(1.07); }
.team-chip.selected { border-color: #f0c040 !important; box-shadow: 0 0 14px rgba(240,192,64,0.5); transform: scale(1.09); }
.chip-dot { width: 20px; height: 20px; border-radius: 50%; }
.chip-name { font-size: 0.58rem; font-weight: 900; letter-spacing: 0.5px; }
.chip-label { font-size: 0.5rem; color: #666; }

/* Smoke color pickers */
.smoke-row { display:flex; align-items:center; gap:10px; }
input[type="color"] {
  width: 44px; height: 38px;
  border: none; border-radius: 8px;
  cursor: pointer; background: none; padding: 2px;
}
.smoke-hex { color: #bbb; font-size: 0.78rem; font-weight: 700; font-family: monospace; }

/* Buttons */
.btn-row { display:flex; gap:12px; grid-column: 1 / -1; }
.btn {
  flex: 1; border: none; border-radius: 10px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.2rem; letter-spacing: 2px;
  padding: 15px 8px; cursor: pointer; transition: opacity 0.2s;
}
.btn-gold { background: linear-gradient(135deg,#f0c040,#c8860a); color: #000; }
.btn-green { background: linear-gradient(135deg,#22c55e,#16a34a); color: #fff; }
.btn:hover { opacity: 0.82; }

/* Canvas */
.poster-wrap {
  width: min(600px, 96vw);
  aspect-ratio: 1;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 0 80px rgba(240,192,64,0.18);
  flex-shrink: 0;
}
canvas { width:100%; height:100%; display:block; }

.note { color:#333; font-size:0.7rem; text-align:center; }
</style>
</head>
<body>

<h1>🏏 TAMIL247 — POSTER MAKER</h1>
<div id="status">Loading background image...</div>

<div class="controls">

  <!-- BG UPLOAD -->
  <div class="ctrl-group full">
    <label>🖼 Background Image (Default: Tamil247 Stadium)</label>
    <div class="bg-zone" id="bgZone">
      <input type="file" id="bgFile" accept="image/*">
      <span style="font-size:1.5rem">🏟</span>
      <div class="zt">TAP TO CHANGE BACKGROUND</div>
      <div id="bgStatus" style="color:#22c55e;font-size:0.7rem;font-weight:800;display:none">✅ CUSTOM BG LOADED</div>
    </div>
  </div>

  <!-- LEFT PLAYER -->
  <div class="ctrl-group">
    <label>⬅ Left Player Photo</label>
    <div class="upload-zone" id="zone1">
      <input type="file" id="img1" accept="image/*">
      <span class="zi">📸</span>
      <div class="zt">TAP TO UPLOAD</div>
      <img class="zone-thumb" id="prev1">
      <div class="zone-ok" id="ok1">✅ LOADED</div>
    </div>
  </div>

  <!-- RIGHT PLAYER -->
  <div class="ctrl-group">
    <label>➡ Right Player Photo</label>
    <div class="upload-zone" id="zone2">
      <input type="file" id="img2" accept="image/*">
      <span class="zi">📸</span>
      <div class="zt">TAP TO UPLOAD</div>
      <img class="zone-thumb" id="prev2">
      <div class="zone-ok" id="ok2">✅ LOADED</div>
    </div>
  </div>

  <!-- TEAM NAMES -->
  <div class="ctrl-group">
    <label>Team 1 (Left)</label>
    <input type="text" id="team1" value="GT" maxlength="6">
  </div>
  <div class="ctrl-group">
    <label>Team 2 (Right)</label>
    <input type="text" id="team2" value="PBKS" maxlength="6">
  </div>

  <!-- MATCH TEXT -->
  <div class="ctrl-group">
    <label>Match Subtitle</label>
    <input type="text" id="matchSub" value="Aaj Ka Big Match">
  </div>

  <!-- OFFERS -->
  <div class="ctrl-group">
    <label>Offer Line 1</label>
    <input type="text" id="offer1" value="WELCOME BONUS AVAILABLE">
  </div>
  <div class="ctrl-group">
    <label>Offer Line 2 (optional)</label>
    <input type="text" id="offer2" value="">
  </div>

  <!-- WHATSAPP + WEBSITE -->
  <div class="ctrl-group">
    <label>WhatsApp</label>
    <input type="text" id="wa" value="73587 72575">
  </div>
  <div class="ctrl-group">
    <label>Website</label>
    <input type="text" id="site" value="tamil247.vip">
  </div>

  <!-- IPL SMOKE PRESETS -->
  <div class="ipl-section">
    <div class="ipl-title">🎨 IPL Team Smoke — Click to Apply Colors</div>
    <div class="ipl-grid" id="iplGrid"></div>
  </div>

  <!-- CUSTOM SMOKE -->
  <div class="ctrl-group">
    <label>Left Smoke Color</label>
    <div class="smoke-row">
      <input type="color" id="s1" value="#1a5fbf">
      <span class="smoke-hex" id="s1hex">#1a5fbf</span>
    </div>
  </div>
  <div class="ctrl-group">
    <label>Right Smoke Color</label>
    <div class="smoke-row">
      <input type="color" id="s2" value="#cc2200">
      <span class="smoke-hex" id="s2hex">#cc2200</span>
    </div>
  </div>

  <!-- SMOKE INTENSITY -->
  <div class="ctrl-group">
    <label>Smoke Intensity</label>
    <input type="range" id="smokeIntensity" min="0" max="100" value="55" style="width:100%;accent-color:#f0c040;">
  </div>

  <!-- BUTTONS -->
  <div class="btn-row">
    <button class="btn btn-gold" onclick="renderPoster()">🎨 GENERATE</button>
    <button class="btn btn-green" onclick="downloadPoster()">⬇ DOWNLOAD PNG</button>
  </div>

</div>

<div class="poster-wrap">
  <canvas id="poster" width="1080" height="1080"></canvas>
</div>

<p class="note">Use PNG with transparent background for players — looks best!</p>

<script>
const W = 1080, H = 1080;
let bgImg = null, p1 = null, p2 = null;

// ── IPL TEAMS ──
const TEAMS = [
  { abbr:'CSK', name:'Chennai',   c1:'#f5c518', c2:'#003366', bg:'#0a0900' },
  { abbr:'MI',  name:'Mumbai',    c1:'#005da0', c2:'#00bfff', bg:'#000c18' },
  { abbr:'RCB', name:'Bangalore', c1:'#cc0000', c2:'#d4a017', bg:'#110000' },
  { abbr:'KKR', name:'Kolkata',   c1:'#5a0096', c2:'#d4a017', bg:'#080010' },
  { abbr:'DC',  name:'Delhi',     c1:'#004c97', c2:'#ef1c25', bg:'#000816' },
  { abbr:'PBKS',name:'Punjab',    c1:'#c8102e', c2:'#8c8c8c', bg:'#120000' },
  { abbr:'RR',  name:'Rajasthan', c1:'#ea1a85', c2:'#254aa5', bg:'#110010' },
  { abbr:'SRH', name:'Hyderabad', c1:'#f26522', c2:'#d4a017', bg:'#100800' },
  { abbr:'GT',  name:'Gujarat',   c1:'#1c3f6e', c2:'#d4a017', bg:'#04060e' },
  { abbr:'LSG', name:'Lucknow',   c1:'#0057e7', c2:'#00d2ff', bg:'#00060f' },
];

// Build chips
const grid = document.getElementById('iplGrid');
TEAMS.forEach(t => {
  const chip = document.createElement('div');
  chip.className = 'team-chip';
  chip.style.background = t.bg;
  chip.innerHTML = `
    <div class="chip-dot" style="background:linear-gradient(135deg,${t.c1},${t.c2})"></div>
    <div class="chip-name" style="color:${t.c1}">${t.abbr}</div>
    <div class="chip-label" style="color:${t.c2}">${t.name}</div>
  `;
  chip.onclick = () => {
    grid.querySelectorAll('.selected').forEach(c=>c.classList.remove('selected'));
    chip.classList.add('selected');
    setColor('s1', t.c1);
    setColor('s2', t.c2);
    renderPoster();
  };
  grid.appendChild(chip);
});

function setColor(id, val) {
  document.getElementById(id).value = val;
  document.getElementById(id+'hex').textContent = val;
}

// Smoke color pickers
['s1','s2'].forEach(id => {
  document.getElementById(id).addEventListener('input', e => {
    document.getElementById(id+'hex').textContent = e.target.value;
    grid.querySelectorAll('.selected').forEach(c=>c.classList.remove('selected'));
    renderPoster();
  });
});
document.getElementById('smokeIntensity').addEventListener('input', renderPoster);

// ── PHOTO LOADER ──
function loadPhoto(fileInput, slot, prevId, okId) {
  fileInput.addEventListener('change', function() {
    const file = this.files[0];
    if(!file) return;
    status('Loading...');
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        if(slot===1) p1=img; else p2=img;
        const prev = document.getElementById(prevId);
        prev.src = e.target.result;
        prev.style.display = 'block';
        document.getElementById(okId).style.display = 'block';
        status('Photo loaded!');
        renderPoster();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
loadPhoto(document.getElementById('img1'), 1, 'prev1', 'ok1');
loadPhoto(document.getElementById('img2'), 2, 'prev2', 'ok2');

// BG custom upload
document.getElementById('bgFile').addEventListener('change', function() {
  const file = this.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => { bgImg=img; document.getElementById('bgStatus').style.display='block'; status('BG loaded!'); renderPoster(); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
});

// ── LOAD DEFAULT BG (the uploaded Tamil247 image) ──
function loadDefaultBg() {
  // Try to load from the uploaded file path via data URI workaround
  // We'll draw it as base64 embedded — user can also upload custom BG
  status('Load your stadium background via the BG zone above, or upload custom');

  // Attempt to load from same-origin if hosted, else prompt
  // Since this runs locally, we use a fetch approach
  fetch('/mnt/user-data/uploads/1000011495.png')
    .then(r => r.blob())
    .then(blob => {
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => { bgImg=img; status('Stadium loaded!'); renderPoster(); };
      img.src = url;
    })
    .catch(() => {
      status('Upload your stadium BG using the zone above');
      renderPoster();
    });
}

// ── HEX → RGB ──
function hr(hex) {
  const h = hex.replace('#','');
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}

// ── RENDER ──
function renderPoster() {
  const canvas = document.getElementById('poster');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,W,H);

  // 1. BACKGROUND
  if(bgImg) {
    const ar = bgImg.width/bgImg.height;
    let dw,dh,dx,dy;
    if(ar>1){ dh=H; dw=H*ar; dx=(W-dw)/2; dy=0; }
    else    { dw=W; dh=W/ar; dx=0; dy=(H-dh)/2; }
    ctx.drawImage(bgImg,dx,dy,dw,dh);
  } else {
    // fallback dark bg
    const bg = ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#03030e'); bg.addColorStop(0.5,'#080818'); bg.addColorStop(1,'#03030e');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    // draw placeholder message
    ctx.fillStyle='rgba(255,255,255,0.08)';
    ctx.font='bold 28px Montserrat';
    ctx.textAlign='center';
    ctx.fillText('Upload Stadium BG Above',W/2,H*0.5);
  }

  // slight darken top+bottom to keep text readable
  const topDark = ctx.createLinearGradient(0,0,0,H*0.45);
  topDark.addColorStop(0,'rgba(0,0,8,0.72)');
  topDark.addColorStop(1,'rgba(0,0,8,0)');
  ctx.fillStyle=topDark; ctx.fillRect(0,0,W,H);

  const botDark = ctx.createLinearGradient(0,H*0.72,0,H);
  botDark.addColorStop(0,'rgba(0,0,8,0)');
  botDark.addColorStop(1,'rgba(0,0,8,0.88)');
  ctx.fillStyle=botDark; ctx.fillRect(0,0,W,H);

  // 2. SMOKE OVERLAYS
  const intensity = document.getElementById('smokeIntensity').value / 100;
  const [r1,g1,b1] = hr(document.getElementById('s1').value);
  const [r2,g2,b2] = hr(document.getElementById('s2').value);

  function smoke(cx,cy,r,g,b,spread,alpha) {
    const sg = ctx.createRadialGradient(cx,cy,0,cx,cy,spread);
    sg.addColorStop(0,`rgba(${r},${g},${b},${alpha})`);
    sg.addColorStop(0.35,`rgba(${r},${g},${b},${alpha*0.55})`);
    sg.addColorStop(0.65,`rgba(${r},${g},${b},${alpha*0.18})`);
    sg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=sg; ctx.fillRect(0,0,W,H);
  }

  smoke(W*0.04, H*0.72, r1,g1,b1, W*0.72, intensity*0.90);
  smoke(W*0.96, H*0.72, r2,g2,b2, W*0.72, intensity*0.90);

  // Tendrils
  function tendrils(cx,cy,r,g,b,dir,alpha) {
    ctx.save();
    for(let i=0;i<9;i++){
      const angle = (dir>0?0.08:0.92)*Math.PI + (Math.random()-0.5)*0.9;
      const len = 180+Math.random()*280;
      const x2=cx+Math.cos(angle)*len, y2=cy-len*0.5;
      const cpx=cx+(x2-cx)*0.3+dir*70, cpy=cy-120;
      const tg=ctx.createLinearGradient(cx,cy,x2,y2);
      tg.addColorStop(0,`rgba(${r},${g},${b},${alpha*0.55})`);
      tg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.beginPath(); ctx.moveTo(cx,cy);
      ctx.quadraticCurveTo(cpx,cpy,x2,y2);
      ctx.strokeStyle=tg; ctx.lineWidth=24+Math.random()*55; ctx.lineCap='round'; ctx.stroke();
    }
    ctx.restore();
  }
  tendrils(W*0.06,H*0.92, r1,g1,b1, 1,  intensity*0.55);
  tendrils(W*0.94,H*0.92, r2,g2,b2, -1, intensity*0.55);

  // 3. PLAYERS
  function drawPlayer(img, side) {
    if(!img){
      ctx.save(); ctx.globalAlpha=0.12;
      const px=side==='left'?W*0.01:W*0.45;
      ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.roundRect(px,H*0.42,W*0.43,H*0.5,10); ctx.fill();
      ctx.globalAlpha=0.35; ctx.fillStyle='#fff';
      ctx.font='bold 28px Montserrat'; ctx.textAlign='center';
      ctx.fillText('📸 Upload Photo',px+W*0.215,H*0.68);
      ctx.restore(); return;
    }
    const ar=img.width/img.height;
    const dH=H*0.76, dW=dH*ar;
    const py=H-dH+H*0.03;
    const px=side==='left'? W*0.01 : W-dW-W*0.01;
    // foot shadow
    const fsh=ctx.createRadialGradient(px+dW/2,H*0.98,0,px+dW/2,H*0.98,dW*0.5);
    fsh.addColorStop(0,'rgba(0,0,0,0.65)'); fsh.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=fsh; ctx.fillRect(px,H*0.88,dW,H*0.12);
    ctx.drawImage(img,px,py,dW,dH);
  }
  drawPlayer(p1,'left');
  drawPlayer(p2,'right');

  // 4. VS BADGE — 3D gold style like the original
  const vx=W/2, vy=H*0.56;
  // outer glow
  const vsgl=ctx.createRadialGradient(vx,vy,0,vx,vy,200);
  vsgl.addColorStop(0,'rgba(240,192,50,0.30)'); vsgl.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=vsgl; ctx.beginPath(); ctx.arc(vx,vy,200,0,Math.PI*2); ctx.fill();

  // VS text — large, bold, gold 3D
  ctx.save();
  ctx.textAlign='center'; ctx.textBaseline='middle';

  // shadow layers for 3D
  const vsSize = 200;
  ctx.font=`bold ${vsSize}px 'Bebas Neue'`;
  for(let i=12;i>0;i--){
    ctx.fillStyle=`rgba(80,40,0,${0.06*i})`;
    ctx.fillText('VS',vx+i*2,vy+i*2);
  }

  // stroke outline
  ctx.strokeStyle='rgba(100,50,0,0.8)'; ctx.lineWidth=8;
  ctx.strokeText('VS',vx,vy);

  // gold gradient fill
  const vsGrad=ctx.createLinearGradient(vx-180,vy-100,vx+180,vy+100);
  vsGrad.addColorStop(0,'#7a4a00');
  vsGrad.addColorStop(0.2,'#c8860a');
  vsGrad.addColorStop(0.45,'#f5d060');
  vsGrad.addColorStop(0.5,'#fff8c0');
  vsGrad.addColorStop(0.55,'#f5d060');
  vsGrad.addColorStop(0.8,'#c8860a');
  vsGrad.addColorStop(1,'#7a4a00');
  ctx.fillStyle=vsGrad;
  ctx.fillText('VS',vx,vy);
  ctx.restore();

  // thin gold light ray
  ctx.save();
  ctx.globalAlpha=0.25;
  const ray=ctx.createLinearGradient(vx,vy-300,vx,vy+300);
  ray.addColorStop(0,'rgba(255,220,80,0)');
  ray.addColorStop(0.5,'rgba(255,220,80,0.6)');
  ray.addColorStop(1,'rgba(255,220,80,0)');
  ctx.fillStyle=ray;
  ctx.fillRect(vx-4,vy-300,8,600);
  ctx.restore();

  // 5. TAMIL247 TITLE
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.font=`bold 100px 'Bebas Neue'`;
  // italic-ish with transform
  ctx.save();
  ctx.transform(1,0,-0.08,1,0,0); // slight italic skew
  const titleX=W/2+H*0.08*0.04;
  const titleGrad=ctx.createLinearGradient(W*0.15,0,W*0.85,0);
  titleGrad.addColorStop(0,'#7a4a00');
  titleGrad.addColorStop(0.2,'#c8860a');
  titleGrad.addColorStop(0.42,'#f5d060');
  titleGrad.addColorStop(0.5,'#fffacc');
  titleGrad.addColorStop(0.6,'#f5d060');
  titleGrad.addColorStop(0.8,'#c8860a');
  titleGrad.addColorStop(1,'#7a4a00');
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.8)'; ctx.font=`bold 100px 'Bebas Neue'`;
  ctx.fillText('TAMIL247',W/2+5,H*0.118+5);
  ctx.fillStyle=titleGrad;
  ctx.fillText('TAMIL247',W/2,H*0.118);
  ctx.restore();

  // 6. TEAM vs TEAM
  const t1=document.getElementById('team1').value.toUpperCase()||'GT';
  const t2=document.getElementById('team2').value.toUpperCase()||'PBKS';
  const matchLine=`${t1} vs ${t2} 🔥`;
  ctx.font=`900 ${t1.length+t2.length>8?88:102}px 'Bebas Neue'`;
  // white with shadow
  ctx.fillStyle='rgba(0,0,0,0.7)';
  ctx.fillText(matchLine,W/2+4,H*0.228+4);
  ctx.fillStyle='#ffffff';
  ctx.shadowColor='rgba(255,255,255,0.2)'; ctx.shadowBlur=16;
  ctx.fillText(matchLine,W/2,H*0.228);
  ctx.shadowBlur=0;

  // 7. SUBTITLE
  const sub=document.getElementById('matchSub').value;
  ctx.font=`800 72px 'Bebas Neue'`;
  ctx.fillStyle='rgba(0,0,0,0.65)';
  ctx.fillText(sub,W/2+3,H*0.316+3);
  ctx.fillStyle='#ffffff';
  ctx.fillText(sub,W/2,H*0.316);

  // offer line 1
  const o1=document.getElementById('offer1').value.toUpperCase();
  if(o1) {
    ctx.font=`800 34px 'Montserrat'`;
    const og=ctx.createLinearGradient(W*0.2,0,W*0.8,0);
    og.addColorStop(0,'#c8860a'); og.addColorStop(0.5,'#f5d060'); og.addColorStop(1,'#c8860a');
    ctx.fillStyle=og;
    ctx.fillText(o1,W/2,H*0.362);
  }
  const o2=document.getElementById('offer2').value.toUpperCase();
  if(o2) {
    ctx.font=`800 30px 'Montserrat'`;
    ctx.fillStyle='rgba(255,220,100,0.85)';
    ctx.fillText(o2,W/2,H*0.402);
  }

  // 8. JOIN NOW BUTTON
  const bY=H*0.876, bW=500, bH=76, bX=W/2-bW/2, bR=38;
  ctx.beginPath();
  ctx.roundRect(bX,bY,bW,bH,bR);
  const btnG=ctx.createLinearGradient(bX,bY,bX+bW,bY);
  btnG.addColorStop(0,'#16a34a'); btnG.addColorStop(0.5,'#22c55e'); btnG.addColorStop(1,'#16a34a');
  ctx.fillStyle=btnG;
  ctx.shadowColor='rgba(34,197,94,0.55)'; ctx.shadowBlur=22; ctx.fill(); ctx.shadowBlur=0;
  ctx.fillStyle='#fff'; ctx.font=`900 44px 'Bebas Neue'`;
  ctx.fillText('JOIN NOW',W/2,bY+46);

  // 9. WHATSAPP
  ctx.font=`800 32px 'Montserrat'`;
  ctx.fillStyle='#ffffff';
  ctx.shadowColor='rgba(0,0,0,0.8)'; ctx.shadowBlur=8;
  ctx.fillText(`WhatsApp: ${document.getElementById('wa').value}`,W/2,H*0.956);
  ctx.shadowBlur=0;

  // 10. WEBSITE
  ctx.font=`700 26px 'Montserrat'`;
  ctx.fillStyle='rgba(255,255,255,0.55)';
  ctx.fillText(document.getElementById('site').value,W/2,H*0.978);
}

// ── DOWNLOAD ──
function downloadPoster() {
  renderPoster();
  setTimeout(()=>{
    const a=document.createElement('a');
    a.download='tamil247-poster.png';
    a.href=document.getElementById('poster').toDataURL('image/png');
    a.click(); status('✅ Downloaded!');
  },150);
}

function status(msg) {
  document.getElementById('status').textContent=msg;
  if(msg) setTimeout(()=>{ document.getElementById('status').textContent=''; },3500);
}

// Live text updates
['team1','team2','matchSub','offer1','offer2','wa','site'].forEach(id=>{
  document.getElementById(id).addEventListener('input',renderPoster);
});

// Init
loadDefaultBg();
</script>
